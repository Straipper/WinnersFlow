<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Welcome to DT FLOW</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#030205;color:#fff;font-family:Inter,Arial,sans-serif}body{min-height:100vh;display:grid;place-items:center;overflow:hidden}.glow{position:fixed;width:55vw;height:55vw;max-width:700px;max-height:700px;border-radius:50%;background:radial-gradient(circle,rgba(155,92,255,.25),rgba(239,156,255,.08) 35%,transparent 70%);filter:blur(25px);animation:pulse 2.8s ease-in-out infinite}.ring{position:fixed;width:260px;height:260px;border:1px solid rgba(216,186,255,.3);border-top-color:#ef9cff;border-radius:50%;animation:spin 2.8s linear infinite}.box{position:relative;text-align:center;padding:35px}.small{font-size:11px;letter-spacing:3px;color:#9f93aa;font-weight:800;margin-bottom:18px}.line{height:1px;width:180px;background:linear-gradient(90deg,transparent,#9b5cff,transparent);margin:20px auto}.welcome{font-size:clamp(30px,8vw,68px);font-weight:900;letter-spacing:-3px}.welcome span{display:block;color:#ef9cff;font-style:italic}.status{margin-top:20px;color:#a9a0b3;font-size:13px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#62e7a9;box-shadow:0 0 15px #62e7a9;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.12);opacity:.75}}</style></head><body><div class="glow"></div><div class="ring"></div><main class="box"><div class="small">MARKET INTELLIGENCE ONLINE</div><div class="welcome">WELCOME TO <span>DT FLOW PORTAL</span></div><div class="line"></div><div class="status"><i class="dot"></i><span id="status">VERIFYING ACCESS…</span></div></main><script src="auth.js"></script><script>(async()=>{const s=document.getElementById('status');const t=DTAuth.token();if(!t){location.href='login.html';return}for(let i=0;i<20;i++){try{const r=await DTAuth.access();if(r.access&&r.access.allowed){s.textContent='ACCESS CONFIRMED · ENTERING PORTAL';setTimeout(()=>location.href='portal?welcome=1',650);return}if(r.access&&r.access.reason==='NO_SUBSCRIPTION'){s.textContent='ACCOUNT READY · OPENING CHECKOUT';try{await DTAuth.startCheckout();return}catch(e){}}}catch(e){}await new Promise(r=>setTimeout(r,1500));}s.textContent='ACCESS IS STILL SYNCING · PLEASE WAIT OR RETURN TO LOGIN';})();</script></body></html>
