<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — DT FLOW</title><meta name="description" content="Log in to DT FLOW."><style>
:root{--bg:#030205;--card:#0c0812;--line:#2a2035;--text:#f5f1fa;--muted:#aaa0b5;--violet:#9b5cff;--pink:#ef9cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#241034 0,#08050d 38%,#030205 75%);color:var(--text);font:15px Inter,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.wrap{width:min(440px,100%)}.brand{text-align:center;font-weight:900;font-size:30px;letter-spacing:-1.5px;margin-bottom:28px}.brand span{color:var(--pink);font-style:italic}.card{background:rgba(12,8,18,.94);border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 30px 90px rgba(0,0,0,.55)}h1{margin:0 0 8px;font-size:30px;letter-spacing:-1px}.sub{color:var(--muted);line-height:1.6;margin:0 0 24px}label{display:block;font-size:12px;color:#c8c0cf;margin:16px 0 7px}input{width:100%;padding:14px 15px;border-radius:12px;border:1px solid #33273f;background:#07050a;color:#fff;outline:none}input:focus{border-color:#9b5cff;box-shadow:0 0 0 3px rgba(155,92,255,.12)}button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,#fff,#d8baff);color:#09060d;font-weight:900;cursor:pointer}.error{display:none;margin-top:15px;padding:12px;border-radius:10px;background:#2a1019;border:1px solid #673045;color:#ffb6c9;font-size:13px}.links{margin-top:20px;text-align:center;color:var(--muted);font-size:13px}.links a{color:#e0c7ff}.back{display:block;text-align:center;margin-top:18px;color:#aaa0b5;text-decoration:none;font-size:13px}.tiny{margin-top:20px;color:#776d80;font-size:11px;text-align:center;line-height:1.5}</style></head><body><main class="wrap"><div class="brand">DT <span>FLOW</span></div><section class="card"><h1>Welcome back.</h1><p class="sub">Log in to continue to your DT FLOW workspace.</p><form id="form"><label>Email</label><input id="email" type="email" autocomplete="email" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button id="submit">LOGIN →</button><div id="error" class="error"></div></form><div class="links">New to DT FLOW? <a href="register.html?plan=trial">Start your 3-day trial</a></div></section><a class="back" href="index.html">← Back to DT FLOW</a><div class="tiny">Your card details are handled by Stripe. DT FLOW does not store card numbers or CVC.</div></main><script src="auth.js"></script><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('submit'),err=document.getElementById('error');err.style.display='none';b.disabled=true;b.textContent='SIGNING IN…';try{const data=await DTAuth.request('/api/auth/login',{method:'POST',body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})});DTAuth.saveAuth(data);location.href='welcome.html?from=login';}catch(x){err.textContent=x.message||'Login failed.';err.style.display='block';b.disabled=false;b.textContent='LOGIN →';}});</script></body></html>
